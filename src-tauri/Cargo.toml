[package]
name = "focus-watch"
version = "0.1.0"
description = "macOS-only always-on-top readout of which app currently has focus"
authors = ["hexxt"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

# Not target-gated: this app only builds on macOS.
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
